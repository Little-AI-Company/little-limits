name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: false

jobs:
  macos:
    name: macOS
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Package the app
        run: scripts/package_app.sh
      - name: Verify the signature
        run: codesign --verify --strict --verbose=2 "dist/Little Limits.app"
      - name: Run tests
        run: swift test
      - name: Confirm no tracked file changed
        run: git diff --exit-code

  linux:
    name: Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: swift:6.4.0-noble
    steps:
      - uses: actions/checkout@v7
      - name: Run tests
        run: swift test
